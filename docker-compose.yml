services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16.4-alpine}
    profiles: [core, integrations, full]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leadhopper}
      POSTGRES_USER: ${POSTGRES_USER:-leadhopper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:${REDIS_VERSION:-7.4-alpine}
    profiles: [automation, full]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    profiles: [core, full]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-leadhopper}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-leadhopper}
    ports: ["4000:4000"]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    profiles: [core, full]
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["8080:3000"]

  twenty:
    image: twentycrm/twenty:${TWENTY_VERSION:-0.39.0}
    profiles: [integrations, full]
    ports: ["${TWENTY_PORT:-3000}:3000"]
    environment:
      SERVER_URL: http://localhost:${TWENTY_PORT:-3000}
      PG_DATABASE_URL: postgres://${POSTGRES_USER:-leadhopper}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/twenty
    depends_on:
      postgres: { condition: service_healthy }

  chatwoot:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:-v3.15.0}
    profiles: [integrations, full]
    ports: ["${CHATWOOT_PORT:-3001}:3000"]
    environment:
      RAILS_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: ${POSTGRES_USER:-leadhopper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
